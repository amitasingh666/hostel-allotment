services:
  db:
    image: postgres:16
    container_name: hostel_allotment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      # Defaults for psql inside the container, so `npm run db:schema`
      # needs no user or database name on its command line.
      PGUSER: ${DB_USER}
      PGDATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - hostel_db_data:/var/lib/postgresql/data
      # Makes db/schema.sql readable by psql inside the container.
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hostel_db_data:
